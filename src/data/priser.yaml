# Villkorstexten under "Information" på /priser/.
information:
  - rubrik: Sjukdom
    text: "Om du avbryter din kurs p.g.a. sjukdom, skada eller flytt skall du omedelbart meddela WDF detta skriftligt via e-post. Läkarintyg skall vara WDF tillhanda inom två veckor från att du meddelat att du avbryter kursen. Återbetalning sker för de gånger som återstår av kursen från och med att du meddelat oss på WDF. WDF tar ut en administrationsavgift på 100:- för att göra återbetalningen."
  - rubrik: Abryta dansklass
    text: "Vid avbrott av dansklass efter 3 veckor (från kursstarts vecka) utan sjukdom/skada/flytt, sker ingen återbetalning.\n\nVid avanmälan vid Event/Workshop/Läger ska detta ske senast 72h innan kursdag, för återbetalning. Vid sen avanmälan erbjuds inte återbetalning."
  - rubrik: Ångerrätt
    text: "En anmälan är bindande om den inte återtas enligt reglerna om ångerrätten. Ångerrätten innebär att deltagaren har full ångerrätt i 14 dagar efter att deltagagaren har mottagit antagningsbeskedet till den anmälda kursen. För att ångarea köpet skickar deltagaren ett mail till info@wilsondancefactory.se inom 14 dagar från det att deltagaren fått antagningsbeskedet från Wilson Dance Factory. Om kursen har startat och deltagaren har deltagit vid ett kurstillfälle har deltagaren accepterat att avstå sin ångerrätt."
  - rubrik: Anmälan
    text: "Man kan anmäla sig till en kurs fram till och med 3e kursveckan vid var termin, önskar man anmäla sig efter den 3:e veckan ska man kontakta kontoret på: info@wilsondancefactory.se"
  - rubrik: Ändringar
    text: "WDF förbehåller sig rätten till ev. ändringar i kursschemat både innan kursstart, men även under terminens gång."
  - rubrik: Presentkort
    text: "Alla våra presentkort har 1 års giltighet från och med köpesdatum. Det går även bra att använda dem i vår webbshop."
